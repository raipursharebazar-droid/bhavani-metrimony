<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Bhavani Matrimony</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="dot"></span>Bhavani Matrimony</a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="search.html">Search</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li id="nav-auth-slot"><a href="login.html" class="active">Login</a></li>
    </ul>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card reveal">
    <h2>Welcome back</h2>
    <p class="sub">Login to view and manage your profile.</p>

    <div id="form-msg" class="form-msg"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" id="login-btn" class="btn btn-solid btn-block" style="margin-top:8px;">Login</button>
    </form>

    <div class="auth-switch">New here? <a href="register.html">Create a free profile</a></div>
  </div>
</div>

<script src="app.js"></script>
<script>
  const form = document.getElementById('login-form');
  const msg = document.getElementById('form-msg');
  const btn = document.getElementById('login-btn');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Logging in...';

    // Demo mode — no backend connected yet.
    setTimeout(() => {
      showMsg(msg, "Demo mode: this is where login would happen. Backend not connected yet.", 'success');
      btn.disabled = false;
      btn.textContent = 'Login';
    }, 800);
  });
</script>
</body>
</html>
